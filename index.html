  <main>

    <section class="hero">
      <div class="hero_container">
        <div class="hero_content">
          <div class="hero_text">
            <h1>пеКВАрня</h1>

по&nbsp;рецептам из&nbsp;тридевятого царства</p>

        <img class="first_frog" src="img/first frog.svg" alt="">
      </div>
    </section>
    <section>
      <div class="uzor">
        <img class="uzor" src="img/uzor.svg" alt="">
      </div>
    </section>
    
    <!-- второй блок -->
     <section class="about">
      <div class="about_container">
        <div class="about_content">
          <img src="img/second frog.svg" alt="">
          <div class="about_text">
            <div class="about_text_p">
              <h4>Наша пекарня&nbsp;&mdash; 
это свежая выпечка, горячие напитки и&nbsp;атмосфера родного болота прямо в&nbsp;городе.</h4>
            </div>
          </div>
        </div>

          <div class="menu_text">

          </div>
          <div class="menu_row">
            <div class="menu_food">
              <img src="img/kish.svg" alt="">
              <div class="menu_name">
                <h3>киш</h3>
              </div>
            </div>
            <div class="menu_food">
              <img src="img/vatrushka.svg" alt="">
              <div class="menu_name">
                <h3>ватрушка</h3>
              </div>
            </div>
            <div class="menu_food">
              <img src="img/rulet.svg" alt="">
              <div class="menu_name">
                <h3>рулет</h3>
              </div>
            </div>
          </div>
          <div class="menu_row">
            <div class="menu_food">
              <img src="img/pirogok.svg" alt="">
              <div class="menu_name">
                <h3>пирожок</h3>
              </div>
            </div>
            <div class="menu_food">
              <img src="img/kulebaka.svg" alt="">
              <div class="menu_name">
                <h3>кулебяка</h3>
              </div>
            <div class="menu_food">
              <img src="img/kovrigka.svg" alt="">
              <div class="menu_name">
                <h3>коврижка</h3>
              </div>
            </div>
          </div>
        </div>
      </div>
